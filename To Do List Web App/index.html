<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="./script.js" defer></script>
    <title>To-do List</title>
  </head>
  <body>
    <main class="todo-app" role="main">
      <section class="todo-card">
        <header class="todo-header">
          <h1>📝 To-do List</h1>
          <button id="themeToggle" aria-label="Toggle light/dark mode" class="icon-btn">
            <i data-feather="moon"></i>
          </button>
        </header>
        <form class="todo-input" autocomplete="off" onsubmit="return false;">
          <label for="todoInput" class="visually-hidden">Add a new todo</label>
          <input
            type="text"
            class="input-field"
            id="todoInput"
            placeholder="What needs to be done?"
            aria-label="Add a new todo"
            maxlength="80"
          />
          <button class="btn add-btn" type="button" id="addButton" aria-label="Add todo">
            <i data-feather="plus"></i>
          </button>
        </form>
        <ul class="todo-list" id="todoList" aria-live="polite">
          <!-- Todo items will be appended here -->
        </ul>
        <div>
          <hr class="divider" />
          <div class="counter-container">
            <p><span id="todoCount">0</span> items</p>
            <button id="deleteButton" type="button" class="btn danger-btn" aria-label="Delete all todos">
              <i data-feather="trash-2"></i> Delete All
            </button>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="footer">
        <p class="made-by">Made by <span class="author">Hemanth Chowdary Bezawada</span></p>
      </div>
    </footer>
    <script>
      feather.replace();
    </script>
  </body>
</html>
